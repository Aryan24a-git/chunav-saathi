steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'  
    args: 
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chunav-saathi'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--max-instances=3'
      - '--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
