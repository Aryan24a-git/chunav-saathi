steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'  
    args: 
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chunav-saathi'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--max-instances=3'
      - '--set-env-vars=NODE_ENV=production,GEMINI_API_KEY=$$GEMINI_API_KEY'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: 'GEMINI_API_KEY'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:latest'
