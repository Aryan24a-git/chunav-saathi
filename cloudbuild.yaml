# Google Cloud Services Used:
# - Cloud Run: Serverless container hosting
# - Cloud Build: CI/CD pipeline  
# - Artifact Registry: Docker image storage
# - Generative AI API: Gemini 1.5 Flash
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'  
    args: 
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chunav-saathi'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--max-instances=3'
      - '--service-account=chunav-sa@chunav-saathi-494717.iam.gserviceaccount.com'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'

substitutions:
  _GIT_SHA: 'latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/chunav-saathi/app:${_GIT_SHA}'
