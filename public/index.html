<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunav Saathi | Indian Election Assistant</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-left">
            <span class="logo">🗳️ Chunav Saathi</span>
        </div>
        <div class="nav-center">
            <button class="nav-btn active" data-page="assistant" id="nav-assistant">🤖 Assistant</button>
            <button class="nav-btn" data-page="quiz" id="nav-quiz">🧠 Quiz</button>
            <button class="nav-btn" data-page="flashcard" id="nav-flashcard">🃏 Flashcards</button>
            <button class="nav-btn" data-page="timeline" id="nav-timeline">📅 Timeline</button>
        </div>
        <div class="nav-right">
            <button id="lang-toggle" class="btn-lang">हिं/EN</button>
        </div>
    </nav>

    <main>
        <!-- ASSISTANT PAGE -->
        <section id="page-assistant" class="page active">
            <div class="chat-container">
                <div id="suggested-chips" class="suggested-bar">
                    <!-- Chips injected by JS -->
                </div>
                <div id="chat-messages" class="chat-messages">
                    <div class="bubble-bot">
                        🗳️ Namaste! I am your Chunav Saathi. How can I help you today regarding Indian elections?
                    </div>
                </div>
                <div class="chat-input-bar">
                    <textarea id="chat-input" placeholder="Ask about Indian elections..." rows="1"></textarea>
                    <button id="tts-btn" class="btn-icon">🔊</button>
                    <button id="send-btn" class="btn-primary">Send</button>
                </div>
            </div>
        </section>

        <!-- QUIZ PAGE -->
        <section id="page-quiz" class="page">
            <div id="topic-selector" class="topic-grid">
                <!-- Topics injected by JS -->
            </div>
            <div id="quiz-content" style="display: none;">
                <div class="quiz-progress">
                    <div id="quiz-progress-inner" style="width: 0%;"></div>
                </div>
                <div class="quiz-card card">
                    <div id="quiz-timer" class="timer">20s</div>
                    <p id="quiz-question" class="question-text"></p>
                    <div id="quiz-options" class="options-grid"></div>
                </div>
            </div>
            <div id="quiz-score-screen" class="card" style="display: none; text-align: center;">
                <!-- Score injected by JS -->
            </div>
        </section>

        <!-- FLASHCARD PAGE -->
        <section id="page-flashcard" class="page">
            <div id="flashcard-filters" class="topic-grid" style="margin-bottom: 1rem;">
                <!-- Filters injected by JS -->
            </div>
            <div class="flashcard-stats">
                <span id="flashcard-counter">0 / 0</span>
                <div class="progress-ring-container">
                    <div id="mastery-percent">0% Mastered</div>
                </div>
            </div>
            <div class="flashcard-container">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-inner">
                        <div class="flashcard-front card">
                            <h3>Question</h3>
                            <p id="flashcard-q"></p>
                        </div>
                        <div class="flashcard-back card">
                            <h3>Answer</h3>
                            <p id="flashcard-a" style="color: var(--accent);"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flashcard-controls">
                <button id="fc-prev" class="btn-secondary">← Prev</button>
                <button id="fc-mastered" class="btn-primary">✓ Got it</button>
                <button id="fc-retry" class="btn-secondary">✗ Study Again</button>
                <button id="fc-next" class="btn-primary">→ Next</button>
            </div>
        </section>

        <!-- TIMELINE PAGE -->
        <section id="page-timeline" class="page">
            <div class="timeline-wrapper">
                <div id="timeline-nodes" class="timeline">
                    <!-- Nodes injected by JS -->
                </div>
            </div>
            <div id="stage-detail-card" class="card" style="margin-top: 2rem; display: none;">
                <h2 id="stage-title"></h2>
                <p id="stage-days" class="tag-chip"></p>
                <p id="stage-desc" style="margin: 1rem 0;"></p>
                <div class="info-box" style="background: var(--surface2); padding: 1rem; border-radius: 8px;">
                    <strong>Key Fact:</strong> <span id="stage-fact"></span>
                </div>
                <button id="stage-ask-btn" class="btn-primary" style="margin-top: 1rem;">Ask Assistant about this →</button>
            </div>
        </section>
    </main>

    <audio id="tts-player" hidden></audio>
    <script src="/js/app.js"></script>
</body>
</html>
